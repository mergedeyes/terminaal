[package]
name = "terminaal"
version = "0.4.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
arboard = { version = "3", features = ["wayland-data-control"] }
# Image data in the kitty graphics protocol (terminal::graphics); the
# version alacritty_terminal uses.
base64 = "0.22"
bytemuck = { version = "1.25.2", features = ["derive"] }
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
env_logger = "0.11.11"
fluent-bundle = "0.16.0"
glyphon = "0.12.0"
image = { version = "0.25", default-features = false, features = ["gif"] }
libc = "0.2.189"
# The same libssh2 ssh2 builds; for the agent forwarding callback, which
# ssh2 doesn't expose (ssh::agent_forward).
libssh2-sys = "0.3.3"
log = "0.4.34"
# zlib-compressed images (terminal::graphics); already in the tree via png.
miniz_oxide = "0.8"
# Telnet over TLS for IBM i (tn5250): the system's OpenSSL, as for ureq.
native-tls = "0.2"
png = "0.18"
pollster = "1.0.1"
# The version alacritty_terminal uses: the PTY wrapper (terminal::filtered_pty)
# registers with its event loop's poller.
polling = "3.11"
serde = { version = "1", features = ["derive"] }
# GitHub's answer about the latest release (update).
serde_json = "1"
# Fingerprints of the keys in known_hosts (ssh::known_hosts).
sha2 = "0.10"
ssh-key = { version = "0.6", features = ["ed25519", "encryption", "getrandom", "std"] }
ssh2 = "0.9.6"
toml = "0.8"
toml_edit = "0.22"
unic-langid = "0.9.6"
# Updates from the GitHub releases (update): HTTPS through the system's
# OpenSSL, which libssh2 links anyway.
ureq = { version = "3", default-features = false, features = ["native-tls"] }
wgpu = "30.0.1"
winit = "0.30.13"

# Wayland: blur, the drop-down window's layer surface and keyboard. Linux
# and the BSDs only; on Windows these modules aren't built.
[target.'cfg(unix)'.dependencies]
# Blur behind the see-through window (ext-background-effect, see blur.rs),
# spoken on winit's own Wayland connection: the versions and features
# winit already uses.
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-client = "0.31.15"
# "unstable": the cursor-shape protocol needs the tablet one.
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
# The drop-down window's layer surface (quake::layer).
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
# The drop-down window's keyboard (quake::keys); winit's own is private.
xkbcommon = "0.8"

[target.'cfg(windows)'.dependencies]
# WSAPoll for the workers' sockets, local time, the Recycle Bin, the UI
# language (platform::windows, i18n), watching folders for SFTP edits and
# live sync (sftp::watch_windows), SSH agents' named pipes
# (ssh::agent_pipe), the program running in a tab
# (platform::windows::process), the setup's entry under Settings → Apps
# and the AppUserModelID (update, platform::windows), DWM's backdrop and
# dark title bar plus the Windows build (blur_windows); the version the
# tree already has.
windows-sys = { version = "0.61", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# OpenSSL for libssh2, built from source (feature `windows-openssl`).
openssl-sys = { version = "0.9", features = ["vendored"], optional = true }

[features]
default = ["windows-openssl"]
# On Windows, libssh2 on OpenSSL rather than Windows' own CNG, which has no
# Ed25519 -- neither for keys nor host keys. Building OpenSSL takes Perl
# (Strawberry, not Git's) and nmake; `--no-default-features` builds without
# it, for a quick try. Changes nothing elsewhere: Linux links the system's
# OpenSSL anyway, the vendored one is only in the Windows table above.
windows-openssl = ["dep:openssl-sys", "ssh2/openssl-on-win32"]

# Text shaping/rasterization is the hot path in the render loop
# (see the [timing] discussion) and ~10x slower unoptimized. These
# crates rarely change, so compiling just them at opt-level 3 buys
# near-release shaping performance in `cargo run` (no --release)
# while `terminal`'s own code stays on the fast-incremental-compile,
# full-debug-info dev profile.
[profile.dev.package.cosmic-text]
opt-level = 3

[profile.dev.package.swash]
opt-level = 3

[profile.dev.package.ttf-parser]
opt-level = 3

# libssh2 is built from source (C, via the `cc` crate), which follows the
# profile's opt-level too -- and its bcrypt key derivation for encrypted
# private keys takes many seconds at -O0, freezing the passphrase step.
[profile.dev.package.libssh2-sys]
opt-level = 3

# Same story for ssh-key's bcrypt KDF when encrypting a newly generated
# key with a passphrase.
[profile.dev.package.bcrypt-pbkdf]
opt-level = 3

[profile.dev.package.blowfish]
opt-level = 3

# Decoding and scaling the startup splash's GIF frames (ui::splash) races
# the first shell prompt; unoptimized it's many times slower, and a splash
# that arrives too late is skipped.
# Hashes of files edited from the server (sftp::edit); unoptimized SHA-256
# is dozens of times slower.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.gif]
opt-level = 3

[profile.dev.package.weezl]
opt-level = 3

[dev-dependencies]
fluent-syntax = "0.12.0"

[build-dependencies]
# The exe's icon and version information on Windows (build.rs); llvm-rc
# when cross-compiling with cargo xwin.
embed-resource = "3"
