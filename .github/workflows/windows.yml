# Keeps the Windows port building: lints Terminaal for Windows, runs its
# tests (those that need Unix are left out by cfg) and builds a release
# exe, kept as an artifact to try out.
name: Windows

on:
  pull_request:
  push:
    branches: [main, feature/windows-port]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      # OpenSSL for libssh2 is built from source (feature `windows-openssl`);
      # its Configure needs a full Perl, which Git's isn't.
      OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable

      - name: Clippy
        run: cargo clippy --all-targets --locked

      - name: Tests
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: terminaal-x86_64-windows
          path: target/release/terminaal.exe
